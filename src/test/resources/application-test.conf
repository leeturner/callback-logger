micronaut {
    server {
        port = -1
    }
}
callback-logger {
    wiremock {
        // a random port, so test contexts never clash
        port = 0
    }
    custom-callbacks {
        // There are dumpicate entries for both post and put to make sure duplicates are removed
        post = ["/api/custom1", "/api/custom1", "/api/custom2"]
        put = ["/api/custom1", "/api/custom1"]
    }
}
