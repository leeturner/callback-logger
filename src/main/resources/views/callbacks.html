<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Logger - Inbox</title>
    <meta name="author" content="Lee Turner">

    <link rel="stylesheet" href="/callback-logger/static/vendor/bulma/bulma.min.css">
    <link id="hljs-light" rel="stylesheet" href="/callback-logger/static/vendor/highlightjs/github.min.css" media="(prefers-color-scheme: light)">
    <link id="hljs-dark" rel="stylesheet" href="/callback-logger/static/vendor/highlightjs/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <script>
        // The theme is 'system' (follow the OS), 'light' or 'dark'. It is applied here in the head, before the page
        // is drawn, so a saved choice doesn't flash the other theme first.
        const THEMES = ['system', 'light', 'dark'];

        function savedTheme() {
            try {
                const theme = localStorage.getItem('theme');
                return THEMES.includes(theme) ? theme : 'system';
            } catch (storageUnavailable) {
                return 'system';
            }
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            root.dataset.themeChoice = theme;
            if (theme === 'system') {
                root.removeAttribute('data-theme');
            } else {
                root.dataset.theme = theme;
            }
            document.getElementById('hljs-light').media =
                theme === 'system' ? '(prefers-color-scheme: light)' : theme === 'light' ? 'all' : 'not all';
            document.getElementById('hljs-dark').media =
                theme === 'system' ? '(prefers-color-scheme: dark)' : theme === 'dark' ? 'all' : 'not all';
        }

        function nextTheme() {
            const theme = THEMES[(THEMES.indexOf(document.documentElement.dataset.themeChoice) + 1) % THEMES.length];
            try {
                localStorage.setItem('theme', theme);
            } catch (storageUnavailable) {
                // the choice still applies until the page is reloaded
            }
            applyTheme(theme);
        }

        applyTheme(savedTheme());
    </script>
    <script src="/callback-logger/static/vendor/highlightjs/highlight.min.js"></script>
    <script type="module" src="/callback-logger/static/vendor/datastar/datastar.js"></script>
    <script>
        // Pretty prints JSON payloads, then lets highlight.js work out the language and colour the payload
        function formatPayload(el) {
            try {
                el.textContent = JSON.stringify(JSON.parse(el.textContent), null, 2);
            } catch (notJson) {
                // leave XML, form data and plain text as they arrived
            }
            hljs.highlightElement(el);
        }

        // Each refresh replaces the cards, which would close any headers or query parameters being read, so the
        // open panels are remembered by callback id and reopened
        const openPanels = new Set();

        function keepOpen(el) {
            el.open = openPanels.has(el.dataset.panel);
            el.addEventListener('toggle', () =>
                el.open ? openPanels.add(el.dataset.panel) : openPanels.delete(el.dataset.panel));
        }
    </script>

    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        .callback .card-header { box-shadow: none; border-bottom: 1px solid var(--bulma-border-weak); }
        .callback .method { min-width: 5.5rem; font-weight: 700; }
        .toolbar { gap: 1rem; }
        .callback .uri { background: none; color: inherit; padding: 0; font-size: 1rem; word-break: break-all; }
        .callback .payload { margin: 0; max-height: 32rem; white-space: pre-wrap; word-break: break-word; border-radius: 0 0 var(--bulma-card-radius) var(--bulma-card-radius); }
        .callback .payload code.hljs { padding: 0; background: none; }
        .callback .details { border-bottom: 1px solid var(--bulma-border-weak); }
        .callback .details summary { cursor: pointer; padding: 0.25rem 0; }
        .callback .details .table { background: none; }
        .callback .details th { white-space: nowrap; width: 1%; }
        .callback .details td code { background: none; padding: 0; word-break: break-all; }
        #callback-list .is-inline-block { max-width: 100%; overflow-x: auto; }
        #theme-toggle .theme-system, #theme-toggle .theme-light, #theme-toggle .theme-dark { display: none; }
        [data-theme-choice="system"] #theme-toggle .theme-system,
        [data-theme-choice="light"] #theme-toggle .theme-light,
        [data-theme-choice="dark"] #theme-toggle .theme-dark { display: inline-flex; }
    </style>
</head>
<body th:with="githubRepo=${'https://github.com/leeturner/callback-logger'}"
      data-signals="{inboxError: false}">

<nav class="navbar is-link" aria-label="main navigation">
    <div class="container is-flex is-justify-content-space-between is-align-items-center px-3">
        <a id="home-link" class="navbar-item has-text-weight-bold is-size-5" href="/callback-logger/">
            <span class="icon mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            </span>
            Callback Logger
        </a>
        <div class="is-flex is-align-items-center">
        <a id="theme-toggle" class="navbar-item" href="#" role="button" onclick="nextTheme(); return false"
                title="Switch between the system, light and dark themes">
            <span class="theme-system is-align-items-center">
                <span class="icon mr-1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></span>
                <span class="is-hidden-mobile">System</span>
            </span>
            <span class="theme-light is-align-items-center">
                <span class="icon mr-1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
                <span class="is-hidden-mobile">Light</span>
            </span>
            <span class="theme-dark is-align-items-center">
                <span class="icon mr-1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
                <span class="is-hidden-mobile">Dark</span>
            </span>
        </a>
        <a id="github-link" class="navbar-item" th:href="${githubRepo}" target="_blank" rel="noopener">
            <span class="icon mr-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            </span>
            <span>Github</span>
        </a>
        </div>
    </div>
</nav>

<main class="section">
    <div class="container">
        <div class="toolbar is-flex is-flex-wrap-wrap is-justify-content-space-between is-align-items-center mb-5">
            <div class="is-flex is-align-items-center">
                <h1 class="title is-3 mb-0 mr-3">Inbox</h1>
                <span th:replace="~{inbox :: count}">2</span>
            </div>
            <div class="is-flex is-flex-wrap-wrap is-align-items-center">
                <div class="buttons mb-0">
                    <button id="refresh-button" class="button is-link mb-0"
                            data-indicator:refreshing
                            data-class:is-loading="$refreshing"
                            data-on:click="@get('/callback-logger/inbox')">
                        <span class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                        </span>
                        <span>Refresh</span>
                    </button>
                    <button th:replace="~{inbox :: clear}">Clear All</button>
                </div>
            </div>
        </div>

        <div id="inbox-error" class="notification is-danger is-light" style="display: none"
             data-show="$inboxError"
             data-on:datastar-fetch="evt.detail.type === 'started' && ($inboxError = false); ['error', 'retries-failed'].includes(evt.detail.type) && ($inboxError = true)">
            Something went wrong talking to the callback logger. Check the server logs and try again.
        </div>

        <!-- Keeps a stream open so new callbacks appear as they arrive. It sits outside the fragments the stream
             patches, or each patch would open the stream again. Datastar gives up after 10 retries by default,
             which would leave the inbox frozen after a few minutes of the app being down, so it keeps trying. -->
        <div id="inbox-stream" data-init="@get('/callback-logger/inbox/stream', {retryMaxCount: Infinity})"></div>

        <div th:replace="~{inbox :: list}">Callbacks</div>
    </div>
</main>

<footer class="footer py-5">
    <div class="content has-text-centered is-size-7">
        Callback Logger &middot; <a th:href="${githubRepo}" target="_blank" rel="noopener">View the source on GitHub</a>
    </div>
</footer>

</body>
</html>
