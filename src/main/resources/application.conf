micronaut {
  application {
    name = "callback-logger"
  }
  server {
    port = 7070
    context-path = "/callback-logger"
  }
  router {
    static-resources {
      // Bulma, Datastar and highlight.js are served from the app so the inbox works without internet access
      default {
        enabled = true
        mapping = "/static/**"
        paths = ["classpath:public"]
      }
    }
  }
}
netty {
  default {
    allocator {
      max-order = 3
    }
  }
}
datasources {
  default {
    url = "jdbc:h2:mem:callback-logger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false"
    username = "sa"
    password = ""
    driverClassName = "org.h2.Driver"
    dialect = "H2"
    schema-generate = "create_drop"
  }
}
callback-logger {
  callback-response-status-code = 200
  callback-response-payload = ""
  wiremock {
    // callbacks are received by WireMock on this port, on any path and any method
    port = 7071
  }
  custom-callbacks {
    // custom callbacks are configured as an array of strings - ["/api/custom1", "/api/custom2"]
    post = []
    put = []
  }
}